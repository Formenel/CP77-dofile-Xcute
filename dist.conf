# dist.conf fuer dofile Xcute - git todist baut dist/dofile_xcute-<version>.zip
#
# Oben im ZIP liegt bin/ - so erkennt Vortex den CET-Mod, und von Hand
# entpackt man es ins Spiel-Hauptverzeichnis ("Cyberpunk 2077\").
# README/CHANGELOG/LICENSE bleiben im Repo, nicht im ZIP.
ZIP="dofile_xcute"
VERZEICHNISSE=(
	bin
)
# von CET zur Laufzeit im Mod-Ordner erzeugt (z. B. ueber dev-link.cmd)
AUSSCHLUSS+=( db.sqlite3 )
